instructions: |
  This GitHub Copilot app harness does not support /loop.
  In plan mode, research, ask questions, and produce an approval-ready plan only.
  After plan approval, execute exactly one atomic GitHub leaf Issue per session.
  Use coordinated background agents for substantial independent scopes while the
  lead continues separate work; do not poll or duplicate delegated work.
  Recurring autonomous cadence belongs to an app scheduled workflow or the product
  Overall Management heartbeat, not a chat slash command.
  GitHub Issues/comments are the sole active plan, question, approval, decision,
  and task ledger. Historical vault plans and decision-log.md are read-only.
  Use local Node.js only; do not add Docker, containers, or Python virtualenvs.

scripts:
  - name: Setup
    command: npm ci --no-audit --no-fund && npm --prefix dashboard ci --legacy-peer-deps --no-audit --no-fund
    triggers:
      - session.create
  - name: Test root
    command: npm test
  - name: Check dashboard
    command: npm --prefix dashboard run check:tests && npm --prefix dashboard run check:types && npm --prefix dashboard run check:arch
  - name: Run dashboard
    command: npm --prefix dashboard run dev

server_ready_pattern: '(?i)Local:\s+(https?://\S+)'
auto_open_in_browser: true

automation:
  auto_issue_session: true
  remote_control: false
