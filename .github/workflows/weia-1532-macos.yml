name: WEIA-1532 exact-candidate macOS evidence
run-name: WEIA-1532 exact-candidate macOS evidence

"on":
  push:
    branches:
      - evidence/weia-1532-macos

permissions:
  contents: read

jobs:
  verify:
    name: Native macOS exact-candidate verification
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVLEAD_ISSUE_INTEGRITY_MODE: "off"
      BASE_HEAD: bab298d5fe0bc3f44b2122b81e5ca4fe5f70f456
      REQUIRED_DIGEST: sha256:69d64d44be37acbb3674e5899abe81b897fdd2e51881fda2a0e848ccb0093677
      CANDIDATE_MANIFEST_B64: 
    steps:
      - name: Check out exact evidence commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify candidate manifest and transport scope before installation
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/weia-1535-evidence"
          mkdir -p "$evidence/commands"
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          evidence = root / "weia-1535-evidence"
          manifest = json.loads(base64.b64decode(os.environ["CANDIDATE_MANIFEST_B64"]))
          expected_paths = [entry["path"] for entry in manifest]
          if len(expected_paths) != 44 or len(set(expected_paths)) != 44:
              raise SystemExit("candidate manifest path count/uniqueness mismatch")

          actual_entries = []
          digest = hashlib.sha256()
          for expected in manifest:
              path = expected["path"]
              target = root / path
              if not target.is_file():
                  raise SystemExit(f"missing candidate path: {path}")
              data = target.read_bytes()
              actual_sha = hashlib.sha256(data).hexdigest()
              actual_size = len(data)
              if actual_sha != expected["sha256"] or actual_size != expected["size"]:
                  raise SystemExit(f"candidate byte mismatch: {path}")
              digest.update(path.encode("utf-8") + b"\0" + actual_sha.encode("ascii") + b"\n")
              actual_entries.append({"path": path, "sha256": actual_sha, "size": actual_size})

          actual_digest = "sha256:" + digest.hexdigest()
          if actual_digest != os.environ["REQUIRED_DIGEST"]:
              raise SystemExit(f"manifest digest mismatch: {actual_digest}")

          parent = subprocess.check_output(["git", "rev-parse", "HEAD^"], text=True).strip()
          if parent != os.environ["BASE_HEAD"]:
              raise SystemExit(f"evidence commit parent mismatch: {parent}")
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=ACDMRTUXB", os.environ["BASE_HEAD"], "HEAD"],
              text=True,
          ).splitlines()
          expected_changed = set(expected_paths) | {".github/workflows/weia-1532-macos.yml"}
          if set(changed) != expected_changed or len(changed) != len(expected_changed):
              raise SystemExit("transport changed-path set mismatch")

          payload = {
              "baseHead": os.environ["BASE_HEAD"],
              "evidenceHead": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "githubRef": os.environ.get("GITHUB_REF"),
              "githubRefName": os.environ.get("GITHUB_REF_NAME"),
              "pathCount": len(actual_entries),
              "manifestDigest": actual_digest,
              "workflowOnlyExtraPath": True,
              "changedPaths": changed,
              "files": actual_entries,
          }
          (evidence / "pre-test-manifest.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8", newline="\n"
          )
          print(json.dumps({
              "baseHead": payload["baseHead"],
              "evidenceHead": payload["evidenceHead"],
              "pathCount": payload["pathCount"],
              "manifestDigest": payload["manifestDigest"],
              "workflowOnlyExtraPath": payload["workflowOnlyExtraPath"],
          }, separators=(",", ":")))
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Record native macOS and toolchain facts
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/weia-1535-evidence"
          {
            echo '### sw_vers'
            sw_vers
            echo '### architecture'
            uname -m
            echo '### uname'
            uname -a
            echo '### node'
            node --version
            echo '### npm'
            npm --version
            echo '### DEVLEAD_ISSUE_INTEGRITY_MODE'
            printf '%s\n' "$DEVLEAD_ISSUE_INTEGRITY_MODE"
          } | tee "$evidence/native-facts.txt"

      - name: Install and execute the complete accepted verification matrix
        id: matrix
        shell: bash
        run: |
          set -uo pipefail
          evidence="$GITHUB_WORKSPACE/weia-1535-evidence"
          summary="$evidence/command-summary.tsv"
          printf 'name\texitCode\tdurationSeconds\tcommand\n' > "$summary"
          failed=0
          LAST_RC=0

          run_capture() {
            local name="$1"
            local display="$2"
            shift 2
            local out="$evidence/commands/${name}.stdout.txt"
            local err="$evidence/commands/${name}.stderr.txt"
            local start end duration rc
            start="$(date +%s)"
            set +e
            "$@" > >(tee "$out") 2> >(tee "$err" >&2)
            rc=$?
            set -e
            end="$(date +%s)"
            duration=$((end - start))
            printf '%s\t%s\t%s\t%s\n' "$name" "$rc" "$duration" "$display" | tee -a "$summary"
            LAST_RC=$rc
          }

          expect_zero() {
            if [ "$LAST_RC" -ne 0 ]; then
              failed=1
            fi
          }

          run_capture npm-ci-root 'npm ci' npm ci
          expect_zero
          run_capture npm-ci-dashboard 'cd dashboard && npm ci' bash -lc 'cd dashboard && npm ci'
          expect_zero

          run_capture root-focused-contracts-attention-lifecycle 'node --test tests/long-horizon-contracts.test.js tests/long-horizon-attention.test.js tests/long-horizon-lifecycle.test.js' \
            node --test tests/long-horizon-contracts.test.js tests/long-horizon-attention.test.js tests/long-horizon-lifecycle.test.js
          expect_zero
          run_capture root-focused-store-recurrence-parity 'node --test tests/long-horizon-store.test.js tests/long-horizon-recurrence.test.js tests/long-horizon-projection-parity.test.js' \
            node --test tests/long-horizon-store.test.js tests/long-horizon-recurrence.test.js tests/long-horizon-projection-parity.test.js
          expect_zero

          run_capture integrity-cli 'node scripts/devlead-integrity.js --fixture tests/fixtures/long-horizon/blocked-chain-8d.json --at 2026-08-03T00:00:00.000Z --format json' \
            node scripts/devlead-integrity.js --fixture tests/fixtures/long-horizon/blocked-chain-8d.json --at 2026-08-03T00:00:00.000Z --format json
          cli_rc="$LAST_RC"
          set +e
          node - "$evidence/commands/integrity-cli.stdout.txt" "$evidence/commands/integrity-cli.stderr.txt" "$cli_rc" <<'NODE' | tee "$evidence/integrity-cli-validation.json"
          const fs = require('node:fs');
          const [stdoutPath, stderrPath, exitText] = process.argv.slice(2);
          const stdout = fs.readFileSync(stdoutPath, 'utf8');
          const stderr = fs.readFileSync(stderrPath, 'utf8');
          let parsed = null;
          let parseable = false;
          try {
            parsed = JSON.parse(stdout);
            parseable = true;
          } catch {}
          const canonical = parseable && stdout === `${JSON.stringify(parsed)}\n`;
          const closeAllowed = parseable ? parsed?.lifecycle?.closeAllowed : null;
          const result = {
            exitCode: Number(exitText),
            parseable,
            canonical,
            stderrBytes: Buffer.byteLength(stderr),
            closeAllowed,
            accepted: Number(exitText) === 1 && parseable && canonical && stderr.length === 0 && closeAllowed === false,
          };
          process.stdout.write(`${JSON.stringify(result)}\n`);
          process.exit(result.accepted ? 0 : 1);
          NODE
          cli_validation_rc=$?
          set -e
          if [ "$cli_validation_rc" -ne 0 ]; then
            failed=1
          fi

          run_capture root-npm-test 'npm test' npm test
          expect_zero
          run_capture dashboard-focused-jest 'cd dashboard && npx jest --runInBand __tests__/issue-integrity-routes.test.ts __tests__/issue-integrity-panel.test.tsx __tests__/issue-attention-badge.test.tsx' \
            bash -lc 'cd dashboard && npx jest --runInBand __tests__/issue-integrity-routes.test.ts __tests__/issue-integrity-panel.test.tsx __tests__/issue-attention-badge.test.tsx'
          expect_zero
          run_capture dashboard-check-types 'cd dashboard && npm run check:types' bash -lc 'cd dashboard && npm run check:types'
          expect_zero
          run_capture dashboard-build 'cd dashboard && npm run build' bash -lc 'cd dashboard && npm run build'
          expect_zero
          run_capture git-diff-check 'git diff --check' git diff --check
          expect_zero
          run_capture git-base-diff-check 'git diff --check bab298d5fe0bc3f44b2122b81e5ca4fe5f70f456 HEAD' \
            git diff --check bab298d5fe0bc3f44b2122b81e5ca4fe5f70f456 HEAD
          expect_zero
          run_capture final-git-status 'git status --short --branch' git status --short --branch
          expect_zero
          run_capture final-git-porcelain 'git status --porcelain=v1 --untracked-files=all' \
            git status --porcelain=v1 --untracked-files=all
          expect_zero
          if [ -s "$evidence/commands/final-git-porcelain.stdout.txt" ]; then
            failed=1
          fi

          python3 - "$summary" "$failed" <<'PY'
          import csv
          import json
          import pathlib
          import sys

          summary_path = pathlib.Path(sys.argv[1])
          rows = list(csv.DictReader(summary_path.open(encoding="utf-8", newline=""), delimiter="\t"))
          payload = {
              "overallAccepted": sys.argv[2] == "0",
              "commands": [
                  {
                      **row,
                      "exitCode": int(row["exitCode"]),
                      "durationSeconds": int(row["durationSeconds"]),
                  }
                  for row in rows
              ],
          }
          (summary_path.parent / "command-summary.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8", newline="\n"
          )
          print(json.dumps({"overallAccepted": payload["overallAccepted"], "commandCount": len(rows)}, separators=(",", ":")))
          PY

          python3 - "$evidence" <<'PY'
          import hashlib
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          lines = []
          for path in sorted(p for p in root.rglob("*") if p.is_file() and p.name != "files.sha256"):
              relative = path.relative_to(root).as_posix()
              lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {relative}")
          (root / "files.sha256").write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")
          PY
          exit "$failed"

      - name: Upload raw macOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weia-1532-macos-${{ github.run_id }}
          path: weia-1535-evidence
          if-no-files-found: error
          retention-days: 14
